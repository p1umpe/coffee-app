openapi: 3.0.3
info:
  title: Simple Coffee API
  version: 0.3.0
  description: MVP — самовывоз + кружка/печати (6+подарок) + оплата CARD/SBP + КДС по PIN + iiko
paths:
  /v1/menu:
    get:
      summary: Меню точки (source — iiko, кэш 60с)
      parameters:
        - {name: shopId, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: 'items: dineInPrice (база), takeawayPrice (напитки −30₽, еда без скидки), givesStamp'}
  /v1/orders:
    post:
      summary: Создать заказ (DINE_IN | TAKEAWAY)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId, items, fulfillment, idempotencyKey]
              properties:
                shopId: {type: string}
                fulfillment: {type: string, enum: [DINE_IN, TAKEAWAY]}
                items: {type: array, items: {type: object}}
                idempotencyKey: {type: string, format: uuid}
      responses:
        '201': {description: orderId, number (А-12), eta, status PENDING_PAYMENT}
  /v1/payments:
    post:
      summary: Создать платёж (CARD | SBP | COUPON | CASH_DESK), идемпотентный
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, method, idempotencyKey]
              properties:
                orderId: {type: string}
                method: {type: string, enum: [CARD, SBP, COUPON, CASH_DESK]}
                idempotencyKey: {type: string, format: uuid}
                couponCode: {type: string}
      responses:
        '201': {description: payment PENDING (CARD/SBP) или SUCCEEDED (COUPON)}
  /v1/payments/{id}/confirm:
    post:
      summary: Мок-подтверждение эквайринга (в проде заменит webhook PSP). Заказ -> PAID
      responses:
        '200': {description: payment SUCCEEDED/FAILED}
  /v1/payments/webhook:
    post:
      summary: Webhook провайдера (подпись — при подключении боевого PSP)
      responses:
        '200': {description: ok}
  /v1/loyalty/me/{userId}:
    get:
      summary: Карта гостя (stamps из 6, купоны)
      responses:
        '200': {description: user + coupons}
  /v1/loyalty/stamp:
    post:
      summary: Начислить печати (старый путь гостя; бариста теперь через /kds/.../serve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, guestQr]
              properties:
                orderId: {type: string}
                guestQr: {type: string}
      responses:
        '200': {description: stampsTotal, freeCoupons (6 печатей = купон)}
  /v1/auth/staff/login:
    post:
      summary: Вход персонала по PIN (режим КДС в том же приложении) -> staff JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, pin]
              properties:
                login: {type: string}
                pin: {type: string}
      responses:
        '200': {description: accessToken (role=staff) + staff}
  /v1/kds/orders:
    get:
      summary: Лента заказов точки (?shopId или своя точка из JWT). Только staff JWT
      responses:
        '200': {description: orders desc, 50}
  /v1/kds/orders/{id}/accept:
    post:
      summary: Бариста принял заказ
      responses:
        '200': {description: order ACCEPTED}
  /v1/kds/orders/{id}/cooking:
    post:
      summary: Готовится
      responses:
        '200': {description: order COOKING}
  /v1/kds/orders/{id}/ready:
    post:
      summary: Готов (гостю push «Забирай!»)
      responses:
        '200': {description: order READY}
  /v1/kds/orders/{id}/serve:
    post:
      summary: Выдано в кружке + скан QR = печати (6 -> купон на 7-й кофе)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestQr]
              properties:
                guestQr: {type: string}
      responses:
        '200': {description: ok, added, stamps, newCoupons}
  /v1/iiko/webhook:
    post:
      summary: Webhook статусов кухни iiko → push гостю
      responses:
        '200': {description: ok}

